<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>Offline · Blackhand</title>
    <script>
      // Honour the theme chosen in the app (same key as app/lib/theme.ts),
      // falling back to the device setting via the media query below.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute('content', t === 'dark' ? '#0a0a0a' : '#ffffff');
          });
        }
      } catch (e) {}
    </script>
    <style>
      /* The design tokens from app/globals.css, copied: this page must work
         with no stylesheet from the server. */
      :root {
        --paper: #ffffff;
        --ink: #0a0a0a;
        --mute: #6b6b6b;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --paper: #0a0a0a;
          --ink: #f5f5f5;
          --mute: #9b9b9b;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --paper: #0a0a0a;
        --ink: #f5f5f5;
        --mute: #9b9b9b;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      }
      main { width: 100%; max-width: 380px; }
      .logo {
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        font-style: italic;
        font-size: 32px;
        letter-spacing: -0.03em;
        margin: 0 0 40px;
      }
      .logo span { color: var(--mute); }
      h1 {
        font-size: 32px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        margin: 0;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--ink);
      }
      p { color: var(--mute); font-size: 15px; line-height: 1.6; margin: 16px 0 28px; }
      button {
        min-height: 48px;
        padding: 0 24px;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: var(--ink);
        color: var(--paper);
        font: 700 11px/1 Poppins, system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #b91c1c; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="logo">Blackhand<span>.</span></p>
      <h1>Anda sedang offline</h1>
      <p>Periksa koneksi internet Anda, lalu coba lagi. Karya, toko, dan pesanan Anda kembali begitu tersambung.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
    <script>
      // Come back by itself as soon as the connection returns.
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
